name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force a controlled failure to demonstrate pipeline failure evidence'
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install JMeter
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless wget
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.2.tgz -O /tmp/jmeter.tgz
          sudo tar -xzf /tmp/jmeter.tgz -C /opt
          sudo ln -sf /opt/apache-jmeter-5.6.2/bin/jmeter /usr/local/bin/jmeter

      - name: Run API tests
        run: npm run test:api

      - name: Run UI tests
        run: npm run test:ui

      - name: Prepare JMeter output directories
        run: |
          rm -f performance/results.jtl
          rm -rf performance/reports/html-report
          mkdir -p performance/reports

      - name: Run JMeter performance test
        run: npm run test:performance

      - name: Simulate controlled failure
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo "Controlled failure requested for pipeline evidence"
          exit 1

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      - name: Upload JMeter report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: jmeter-report
          path: performance/reports/html-report
          if-no-files-found: warn
